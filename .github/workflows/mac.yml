# macOS(Apple Silicon) 빌드. Actions 화면에서 직접 실행하거나, v로 시작하는 태그를 올리거나, remake 브랜치에서 맥 빌드에 닿는 파일이 바뀌면 돈다.
# 서명은 ad-hoc만 한다 (Apple 개발자 계정 없음). 결과 .dmg는 실행 결과의 Artifacts에서 받는다.
name: mac build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # 작업 브랜치에서는 맥 빌드에 닿는 파일이 바뀔 때만 돈다 (workflow_dispatch는 기본 브랜치에 파일이 있어야 화면에 보인다)
    branches: [remake]
    paths:
      - 'app/src-tauri/**'
      - 'app/tools/fetch-llama.ts'
      - 'app/package.json'
      - '.github/workflows/mac.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci

      - name: 검사 (lint, 타입, 테스트, 시나리오)
        run: |
          npm run lint
          npx tsc -b
          npm test
          npm run validate

      - name: llama-server 받기와 실행 확인
        run: |
          npm run fetch-llama
          ls -la src-tauri/llama
          otool -L src-tauri/llama/llama-server
          src-tauri/llama/llama-server --version
          src-tauri/llama/llama-server --list-devices

      - name: Rust 테스트
        working-directory: app/src-tauri
        run: cargo test

      - name: 앱 빌드
        run: npx tauri build

      - name: 번들 안의 llama-server 실행 확인
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          ls -la "$APP/Contents/Resources/llama"
          "$APP/Contents/Resources/llama/llama-server" --list-devices
          codesign -dv "$APP" 2>&1 | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: social-engineer-macos-arm64
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
